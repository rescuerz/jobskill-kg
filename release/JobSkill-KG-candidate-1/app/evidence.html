<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>JobSkill-KG 证据查询</title>
<style>body{font:16px/1.7 system-ui;max-width:1000px;margin:40px auto;padding:0 20px;color:#183047;background:#f4f7fb}input,button{font:inherit;padding:8px;margin:4px}article{background:white;border:1px solid #ccd7e4;border-radius:10px;padding:20px;margin:16px 0}pre{white-space:pre-wrap}small{color:#526579}label{display:inline-block}</style>
<h1>岗位技能关联查询</h1><p>同时匹配城市、岗位族和全部技能；可进一步筛选某项技能被明确列为加分项的岗位。结果附原句及来源。</p>
<form id="search"><label>城市<input name="city" value="杭州"></label><label>岗位族<input name="family" value="算法"></label><label>同时包含的技能（逗号分隔）<input name="skills" value="Python,PyTorch"></label><label>加分技能（可留空）<input name="optional_skill" placeholder="例如：大语言模型"></label><button>查询</button></form>
<p id="status" role="status"></p><div id="results"></div><small>当前为词典与局部规则结果，尚未经真人验证。“未说明”不表示必备。“至少一门/任一”等选择条件可能被规则误判为逐项必备，应以原句为准。岗位数据为采集快照，原招聘链接可能失效。</small>
<script>
const form=document.getElementById('search'),result=document.getElementById('results'),statusEl=document.getElementById('status');
function element(tag,text,parent){const e=document.createElement(tag);e.textContent=text;parent.append(e);return e;}
form.onsubmit=async e=>{e.preventDefault();statusEl.textContent='查询中…';result.replaceChildren();try{const response=await fetch('/api/evidence?'+new URLSearchParams(new FormData(form)));const data=await response.json();if(!response.ok)throw Error(data.error);statusEl.textContent=`共 ${data.total} 个岗位，展示 ${data.items.length} 个。`;for(const j of data.items){const card=element('article','',result);element('h2',j.title,card);element('p',`${j.company} · ${j.city.join('、')} · ${j.family}`,card);if(/^https?:\/\//.test(j.url)){const a=element('a','查看招聘来源',card);a.href=j.url;a.target='_blank';a.rel='noopener noreferrer';}for(const s of j.evidence){element('h3',`${s.name}：${s.proficiency} / ${s.necessity}`,card);for(const ev of s.evidence){element('blockquote',ev.quote || '该条公开记录仅提供来源与位置，请打开招聘来源核对。',card);element('small',`${ev.field} 字符 ${ev.start}–${ev.end}；本次提及：${ev.proficiency}/${ev.necessity}`,card);}}}}catch(error){statusEl.textContent='查询失败：'+error.message;}};
</script></html>
