function safeLink(url){try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:null;}catch{return null;}}
function companyLine(j,parent){const row=el('div',null,parent,'company-line');el('span',j.company.slice(0,1),row,'company-logo '+companyClass(j.company));el('span',j.company,row);return row;}
function drawList(){result.replaceChildren();items.forEach(j=>{const card=el('button',null,result,'job-card'+(j.doc_id===selectedId?' selected':''));card.type='button';card.setAttribute('aria-pressed',String(j.doc_id===selectedId));card.setAttribute('aria-label',j.title+'，'+j.company+'，查看技能证据');companyLine(j,card);el('div',j.title,card,'job-title');const meta=el('div',null,card,'job-meta');meta.append(icon('pin'));el('span',j.city.join(' / ')||'地点未说明',meta);el('span','·',meta,'divider');el('span',j.family,meta);const chips=el('div',null,card,'skill-chips');j.evidence.slice(0,4).forEach(s=>el('span',s.name+(s.necessity==='加分'?' · 加分':''),chips,'chip'+(s.necessity==='加分'?' bonus':'')));if(j.evidence.length>4)el('span','+'+(j.evidence.length-4),chips,'chip');if(j.doc_id===selectedId)el('span','↗',card,'selected-arrow');card.onclick=()=>{selectedId=j.doc_id;drawList();drawDetail(j);if(matchMedia('(max-width:800px)').matches)detail.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth',block:'start'});};});}
function highlightedQuote(e,parent){const quote=el('blockquote',null,parent);if(!e.quote){quote.textContent='该记录提供来源与位置，请打开招聘官网核对原文。';return;}const offset=e.start-e.quote_start,end=e.end-e.quote_start;if(Number.isInteger(offset)&&offset>=0&&end>offset&&end<=e.quote.length){quote.append(document.createTextNode(e.quote.slice(0,offset)));el('mark',e.quote.slice(offset,end),quote);quote.append(document.createTextNode(e.quote.slice(end)));}else quote.textContent=e.quote;}
function drawDetail(j){detail.replaceChildren();const head=el('div',null,detail,'detail-header');const label=el('div',null,head,'detail-label');el('span','岗位详情 / JOB INSIGHT',label);const proof=el('span',null,label,'evidence-tag');proof.append(icon('check'));proof.append('来源可追溯');el('h2',j.title,head,'detail-title');el('div',j.company+'  /  '+j.city.join('、')+'  /  '+j.family,head,'detail-meta');const url=safeLink(j.url);if(url){const a=el('a','查看官方招聘信息',head,'source-link');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.append(icon('arrow'));}const body=el('div',null,detail,'detail-body');el('div','技能要求与原文证据',body,'evidence-heading');el('div','点击技能展开原文，标记处为该技能的提及位置。',body,'evidence-caption');if(!j.evidence.length)el('p','该岗位尚未抽取到技能。',body,'result-note');j.evidence.forEach((s,index)=>{const section=el('details',null,body,'skill-evidence');section.open=index<2;const summary=el('summary',null,section);const left=el('span',null,summary,'skill-summary-left');left.append(icon('graph'));el('span',s.name,left);const right=el('span',null,summary,'skill-summary-right');el('span',s.proficiency==='未说明'?'程度未注明':s.proficiency,right,'tag');el('span',s.necessity==='未说明'?'条件未注明':s.necessity,right,'tag'+(s.necessity==='加分'?' bonus':''));el('span',s.evidence.length+' 处',right,'evidence-count');const chevron=icon('chevron');chevron.classList.add('chevron');right.append(chevron);const quotes=el('div',null,section,'quotes');s.evidence.forEach(e=>{const row=el('div',null,quotes,'quote');highlightedQuote(e,row);const meta=el('div',null,row,'quote-meta');el('span',e.field==='requirement'?'任职要求':'岗位描述',meta);const pos=el('details',null,meta);el('summary','查看定位',pos);el('span','字符 '+e.start+'–'+e.end+' · '+e.proficiency+' / '+e.necessity,pos);if(e.crawled_at)el('div','采集时间 '+e.crawled_at.replace('T',' '),pos);});});const note=el('div',null,body,'reading-note');el('strong','阅读提示  ',note);note.append('标签由规则抽取，尚未经真人验证。“未注明”不等于必备；“至少一门”等选择条件需结合原文判断。');}
function showEmpty(message,error=false){result.replaceChildren();detail.replaceChildren();const box=el('div',null,result,'placeholder');box.append(icon(error?'database':'search'));el('strong',error?'暂时无法加载':'没有找到匹配岗位',box);el('div',message,box);const button=el('button',error?'重新查询':'试试杭州算法岗位',box,'primary');button.type='button';button.onclick=()=>error?search(false):preset('algorithm');el('div','调整筛选条件后，这里会展示岗位详情与原文证据。',detail,'placeholder');}
async function search(more=false){if(controller)controller.abort();controller=new AbortController();const current=controller;const params=more&&submitted?new URLSearchParams(submitted):new URLSearchParams(new FormData(form));params.set('skills',(params.get('skills')||'').replace(/[，、]/g,','));if(!more)limit=20;params.set('limit',String(limit));submitted=new URLSearchParams(params);$('searchButton').disabled=true;$('loadMore').hidden=true;$('status').textContent='正在关联岗位与技能…';$('status').classList.remove('error');$('workspace').setAttribute('aria-busy','true');if(!more){result.replaceChildren();for(let i=0;i<3;i++)el('div',null,result,'skeleton');detail.replaceChildren();el('div','正在查找匹配的岗位…',detail,'placeholder');}try{const response=await fetch('/api/evidence?'+params,{signal:current.signal});if(!response.ok)throw Error('服务暂时不可用');const data=await response.json();if(!Array.isArray(data.items))throw Error('返回数据异常');if(current!==controller)return;items=data.items;$('resultCount').textContent=data.total.toLocaleString();$('status').textContent=data.total?'已展示 '+items.length+' / '+data.total+' 个岗位 · 同时满足全部条件':'请尝试减少技能或扩大城市范围';if(items.length){if(!items.some(j=>j.doc_id===selectedId))selectedId=items[0].doc_id;drawList();drawDetail(items.find(j=>j.doc_id===selectedId));$('loadMore').hidden=items.length>=data.total||limit>=200;if(limit>=200&&data.total>200)$('status').textContent='已展示前 200 / '+data.total+' 个岗位，请增加条件缩小范围';}else showEmpty('可以移除加分技能，或减少同时匹配的技能。');}catch(error){if(error.name==='AbortError'||current!==controller)return;$('resultCount').textContent='—';$('status').textContent='连接失败，请重试';$('status').classList.add('error');showEmpty('请确认本地查询服务正在运行。',true);}finally{if(current===controller){$('searchButton').disabled=false;$('workspace').setAttribute('aria-busy','false');}}}
function preset(name){$('city').value=name==='backend'?'':'杭州';$('family').value=name==='backend'?'后端':'算法';$('skills').value=name==='backend'?'Java,Redis':'Python,PyTorch';$('optional_skill').value=name==='llm'?'LLM':'';search();}
form.onsubmit=e=>{e.preventDefault();search();};document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>preset(b.dataset.preset));$('resetButton').onclick=()=>{['city','family','skills','optional_skill'].forEach(id=>$(id).value='');$('city').focus();};$('loadMore').onclick=()=>{limit=Math.min(limit+20,200);search(true);};
function info(kind){const content=$('dialogContent');content.replaceChildren();$('dialogTitle').textContent=kind==='overview'?'这份图谱包含什么？':'如何阅读岗位证据';if(kind==='overview'){if(stats){const grid=el('div',null,content,'dialog-stats');[[stats.jobs,'岗位记录'],[stats.skills,'归一化技能'],[stats.categories,'技能分类'],[Object.keys(stats.by_family).length,'岗位方向']].forEach(([v,label])=>{const d=el('div',null,grid);el('b',v.toLocaleString(),d);el('span',label,d);});el('p','来源：'+Object.keys(stats.by_company).join('、')+'。这是企业招聘快照，不能代表全部就业市场。',content);}else el('p','数据概览暂时无法加载，请刷新后重试。',content);el('p','同义技能经过归一，再关联到岗位和具体要求。页面上的匹配数表示数据集中的记录数，不表示仍在招聘的岗位数。',content);}else{el('p','1. 选择城市和岗位方向，填写希望同时出现的技能。多项技能用逗号分隔，也支持中文逗号。',content);el('p','2. 加分技能会进一步筛选被规则标为“加分”的岗位，例如 LLM 会归一为“大语言模型”。',content);el('p','3. 点击岗位查看原文。高亮表示技能的提及位置；“查看定位”可展开字段位置与采集时间。',content);el('p','程度与必要性由规则推断，可能出现作用域错误。请依据原文判断，尤其留意“任一”“至少一门”等选择条件。',content);}$('infoDialog').showModal();}
$('overviewButton').onclick=()=>info('overview');$('helpButton').onclick=()=>info('help');$('infoDialog').addEventListener('click',e=>{if(e.target===$('infoDialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
fetch('/api/stats').then(r=>{if(!r.ok)throw Error();return r.json();}).then(data=>{stats=data;[['metricJobs',data.jobs],['metricSkills',data.skills],['metricCategories',data.categories],['metricCompanies',Object.keys(data.by_company).length]].forEach(([id,n])=>$(id).textContent=n.toLocaleString());}).catch(()=>{$('metricJobs').title='概览加载失败，请刷新重试';});search();
</script>
</body></html>
